<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김민수 | 디지털 명함</title>
<style>
:root{--bg:#f3f5f9;--bg-grad:linear-gradient(160deg,#ffffff 0%,#dbe8ff 100%);--card:#fff;--text:#1a2030;--muted:#667085;--accent:#4f6bff;--border:#e4e8f0;--chip:#eef1ff;--shadow:0 4px 12px rgba(30,40,80,.06),0 16px 48px rgba(60,90,180,.14)}
:root[data-theme="dark"]{--bg:#0e121b;--bg-grad:linear-gradient(160deg,#14214a 0%,#000000 100%);--card:#171c28;--text:#eef1f7;--muted:#9aa4b8;--accent:#7b91ff;--border:#272e3f;--chip:#212842;--shadow:0 4px 12px rgba(0,0,0,.3),0 16px 48px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg-grad) fixed,var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;transition:background .3s,color .3s}
.card{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:48px 28px 32px;text-align:center;transition:background .3s,border-color .3s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:96px;border-radius:24px 24px 0 0;background:linear-gradient(135deg,var(--accent),#a78bfa);opacity:.18}
.toggle{position:absolute;top:14px;right:14px;width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center}
.toggle:hover{border-color:var(--accent)}
.toggle svg{width:20px;height:20px}
.toggle .sun{display:none}
:root[data-theme="dark"] .toggle .sun{display:block}
:root[data-theme="dark"] .toggle .moon{display:none}
.avatar{position:relative;width:112px;height:112px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:grid;place-items:center;border:4px solid var(--card);box-shadow:0 4px 16px rgba(79,107,255,.3)}
.avatar svg{width:56px;height:56px;color:#fff;opacity:.9}
h1{font-size:1.65rem;letter-spacing:-.02em}
.role{margin-top:4px;color:var(--accent);font-weight:600}
.bio{margin:16px 0 24px;color:var(--muted);line-height:1.65;font-size:.95rem}
.contacts{list-style:none;padding:0;display:grid;gap:8px;text-align:left}
.contacts a,.contacts div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--chip);color:var(--text);text-decoration:none;font-size:.93rem;transition:transform .15s}
.contacts a:hover{transform:translateY(-2px)}
.contacts svg{width:18px;height:18px;flex:none;color:var(--accent)}
.social{display:flex;justify-content:center;gap:12px;margin-top:24px}
.social a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);color:var(--text);transition:transform .2s,background .2s,color .2s,border-color .2s,box-shadow .2s}
.social a:hover,.social a:focus-visible{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-3px) scale(1.12);box-shadow:0 8px 20px rgba(79,107,255,.35)}
.social svg{width:22px;height:22px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:380px){.card{padding:44px 20px 28px}h1{font-size:1.45rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <button class="toggle" id="toggle" aria-label="다크/라이트 모드 전환">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <div class="avatar" role="img" aria-label="프로필 사진 자리">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
  </div>

  <h1>김민수</h1>
  <p class="role">마케팅 매니저 · 스타트업 허브</p>
  <p class="bio">5년차 B2B 마케터. 콘텐츠 마케팅과 그로스 해킹을 좋아합니다. 커피와 자동화 도구를 사랑합니다.</p>

  <ul class="contacts">

    <li><a href="tel:01012345678"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>010-1234-5678</a></li>

  <nav class="social" aria-label="SNS 링크">
    <a href="https://linkedin.com/in/minsu-kim" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5zM5.3 7.4a2.1 2.1 0 1 1 0-4.1 2.1 2.1 0 0 1 0 4.1zM7.1 20.5H3.6V9h3.5z"/></svg></a>
    <a href="https://github.com/minsu-dev" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg></a>
    <a href="https://minsu.dev" target="_blank" rel="noopener" aria-label="블로그" title="블로그"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg></a>
  </nav>
</main>
<script>
const root=document.documentElement;
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
root.dataset.theme=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
document.getElementById('toggle').addEventListener('click',()=>{
  const t=root.dataset.theme==='dark'?'light':'dark';
  root.dataset.theme=t;
  try{localStorage.setItem('theme',t)}catch(e){}
});
</script>
</body>
</html>
